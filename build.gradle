plugins {
	id 'java-library'
	id 'maven-publish'
}

group = 'com.codeagent'
version = '0.12.0'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
	withSourcesJar()
}

repositories {
	mavenCentral()
}

dependencies {
	// 공개 API(CodeGraphEngine, model, rules)는 JavaParser 타입을 드러내지 않지만
	// java 패키지(JavaProject 등)를 쓰는 쪽을 위해 api 로 둔다
	api 'com.github.javaparser:javaparser-symbol-solver-core:3.26.4'
	implementation 'org.slf4j:slf4j-api:2.0.17'
	// Python 파싱 (tree-sitter JNI 바인딩, 네이티브 라이브러리는 jar 안에 OS별로 들어 있음. MIT)
	implementation 'io.github.bonede:tree-sitter:0.26.6'
	implementation 'io.github.bonede:tree-sitter-python:0.25.0'
	// Kotlin 파싱 (같은 tree-sitter 바인딩, MIT)
	implementation 'io.github.bonede:tree-sitter-kotlin:0.3.8.1'
	// Swift·Objective-C 파싱 (모바일 제품용, 기본 파서에는 없음. MIT)
	implementation 'io.github.bonede:tree-sitter-swift:0.5.0'
	implementation 'io.github.bonede:tree-sitter-objc:main-a'

	testImplementation platform('org.junit:junit-bom:5.13.4')
	testImplementation 'org.junit.jupiter:junit-jupiter'
	testImplementation 'org.assertj:assertj-core:3.27.6'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testRuntimeOnly 'org.slf4j:slf4j-simple:2.0.17'
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
	// mcp 플러그인 서버가 Java 17 에서도 돌아야 하므로 엔진도 Java 17 로 컴파일한다
	options.release = 17
}

tasks.named('test') {
	useJUnitPlatform()
	// -PtestJavaVersion=17 이면 테스트를 그 버전 JVM 으로 돌린다 (mcp 플러그인이 Java 17 에서 도는지 확인용)
	def testJavaVersion = providers.gradleProperty('testJavaVersion').orNull
	if (testJavaVersion) {
		javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(testJavaVersion as int) }
	}
	systemProperty 'file.encoding', 'UTF-8'
}

publishing {
	publications {
		maven(MavenPublication) {
			artifactId = 'core-code-agent'
			from components.java
		}
	}
	repositories {
		// ./gradlew publish : GitHub Packages 에 배포 (토큰은 gpr.user/gpr.key 또는 GITHUB_ACTOR/GITHUB_TOKEN)
		maven {
			name = 'GitHubPackages'
			url = uri('https://maven.pkg.github.com/yeomyaloo/cotcha-trail')
			credentials {
				username = providers.gradleProperty('gpr.user').orElse(providers.environmentVariable('GITHUB_ACTOR')).orNull
				password = providers.gradleProperty('gpr.key').orElse(providers.environmentVariable('GITHUB_TOKEN')).orNull
			}
		}
	}
}
