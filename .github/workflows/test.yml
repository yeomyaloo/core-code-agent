# 푸시·PR 마다 테스트를 돌고, v* 태그를 올리면 GitHub Packages 에 배포한다.
# Python 파서는 tree-sitter 네이티브 라이브러리를 쓰므로 OS·CPU 별로, mcp 플러그인처럼 Java 17 로 테스트를 돌린다.
name: test

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      # 빌드는 21 toolchain, 테스트 실행은 17
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            17
            21

      - uses: gradle/actions/setup-gradle@v5

      - name: 테스트 (Java 17 로 실행)
        shell: bash
        run: ./gradlew test --no-daemon -PtestJavaVersion=17

      - name: GitHub Packages 에 배포 (태그만, 한 번)
        if: startsWith(github.ref, 'refs/tags/v') && matrix.os == 'ubuntu-latest'
        run: ./gradlew publish --no-daemon
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 테스트 결과 보관
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: test-results-${{ matrix.os }}
          path: build/reports/tests/test
