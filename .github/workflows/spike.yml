# 시험 구현 브랜치(spike/**) 전용: 네이티브 라이브러리를 쓰는 테스트가 OS·CPU 별로 도는지 확인한다
name: spike

on:
  push:
    branches: ['spike/**']

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-13, windows-latest]
        java: [17]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      # 빌드는 21 toolchain, 테스트 실행은 17 로 (mcp 플러그인이 Java 17 에서 돌기 때문)
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            ${{ matrix.java }}
            21

      - uses: gradle/actions/setup-gradle@v5

      - name: 테스트 (Java 17 로 실행)
        shell: bash
        run: ./gradlew test --no-daemon -PtestJavaVersion=17
